<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<title>Timemark Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  <h1>Timemark Editor</h1>
  <span id="ver"></span>
</header>

<main>
  <label id="pick" for="file">
    <svg viewBox="0 0 24 24" class="ico"><path d="M3 16l5-5 4 4 3-3 6 6"/><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.4"/></svg>
    <span>Chọn ảnh</span>
  </label>
  <input id="file" type="file" accept="image/*" hidden>

  <div class="fields">
    <label class="f"><span>Giờ</span><input id="time" type="time"></label>
    <label class="f dt"><span>Ngày</span><input id="date" type="date"></label>
    <div class="f wd"><span>Thứ</span><b id="weekday">—</b></div>
  </div>

  <div id="stage"><canvas id="cv"></canvas></div>

  <button id="save">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    <span>Lưu ảnh</span>
  </button>

  <p id="status"></p>
  <p id="foot"><button id="reload" type="button">Tải lại bản mới</button></p>
</main>

<script src="inpaint.js"></script>
<script src="timemark.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
